name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # --- Static analysis -----------------------------------------------------
    # Lint dikonfigurasi dengan checkDependencies = true dan menaikkan issue
    # performance/i18n/aksesibilitas menjadi ERROR (lihat app/build.gradle.kts),
    # sehingga regresi pada aspek tersebut langsung menggagalkan pipeline.
    - name: Run Android Lint (all modules)
      run: ./gradlew lint

    - name: Upload Lint Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-reports
        path: |
          app/build/reports/lint-results-debug.html
          core/build/reports/lint-results-debug.html

    # --- Tests ---------------------------------------------------------------
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Upload Unit Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-reports
        path: |
          app/build/reports/tests/testDebugUnitTest
          core/build/reports/tests/testDebugUnitTest

    # --- Debug build (obfuscated: isMinifyEnabled = true) --------------------
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Debug App Bundle
      run: ./gradlew bundleDebug

    - name: Generate debug keystore
      run: |
        mkdir -p "$HOME/.android"
        keytool -genkeypair -v \
          -keystore "$HOME/.android/debug.keystore" \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Build universal APK (includes Dynamic Feature :favorite)
      run: |
        curl -sL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
        KEYSTORE="$HOME/.android/debug.keystore"
        java -jar bundletool.jar build-apks \
          --bundle=app/build/outputs/bundle/debug/app-debug.aab \
          --output=app/build/outputs/apk/debug/cineverse-universal.apks \
          --mode=universal \
          --ks="$KEYSTORE" \
          --ks-pass=pass:android \
          --ks-key-alias=androiddebugkey \
          --key-pass=pass:android
        unzip -o app/build/outputs/apk/debug/cineverse-universal.apks -d app/build/outputs/apk/debug/universal
        mv app/build/outputs/apk/debug/universal/universal.apk app/build/outputs/apk/debug/CineVerse-debug-universal.apk

    # --- Release build (obfuscated + resource shrinking) ---------------------
    - name: Build Release APK & AAB (R8 obfuscation)
      run: ./gradlew assembleRelease bundleRelease

    - name: Upload R8 mapping files (bukti obfuscation)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: r8-mapping-files
        path: |
          app/build/outputs/mapping/debug/mapping.txt
          app/build/outputs/mapping/release/mapping.txt
          core/build/outputs/mapping/debug/mapping.txt
          core/build/outputs/mapping/release/mapping.txt

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: CineVerse-APK
        path: |
          app/build/outputs/apk/debug/CineVerse-debug-universal.apk
          app/build/outputs/bundle/debug/app-debug.aab
          app/build/outputs/bundle/release/app-release.aab
